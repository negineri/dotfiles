[".config/zsh/plugins/zsh-eza"]
type = "git-repo"
url = "https://github.com/z-shell/zsh-eza.git"
refreshPeriod = "168h"
[".config/zsh/plugins/zsh-eza".clone]
args = ["--branch=main", "--depth=1"]

{{- if eq .chezmoi.os "darwin" }}
[".local/bin/bws"]
executable = true
type = "archive-file"
url = "https://github.com/bitwarden/sdk-sm/releases/download/bws-v2.1.0/bws-aarch64-apple-darwin-2.1.0.zip"
refreshPeriod = "168h"
path = "bws"
{{- end }}
