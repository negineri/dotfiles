packages:
  darwin_client:
    brews:
      - "coreutils"
      - "curl"
      - "git"
      - "eza"
      - "ghq"
      - "fzf"
      - "tmux"
      - "gnu-tar"
      - "ripgrep"
      - "gcc"
      - "hashicorp/tap/terraform"
      - "docker"
      - "gh"
      - "oci-cli"
      - "gnupg"
      - "terramate"
      - "unar"
    casks:
      - "font-plemol-jp-nf"
      - "wezterm"
      - "zotero"
      - "blackhole-2ch"
      - "visual-studio-code"
      - "deepl"
      - "wireshark-app"
      - "google-chrome"
      - "slack"
      - "discord"
      - "nextcloud"
      - "zoom"
      - "vlc"
      - "obs"
      - "gns3"
      - "obsidian"
      - "nikitabobko/tap/aerospace"
      - "betterdisplay"
    taps:
      - "hashicorp/tap"
    scripts:
      - "uv"
      - "pnpm"
  debian_server:
    apt:
      - "zsh"
      - "fzf"
      - "tmux"
      - "vim"
    scripts:
      - "eza"
      - "pnpm"
  debian_client:
    apt:
      - "zsh"
      - "fzf"
      - "tmux"
      - "vim"
      - "wl-clipboard"
      - "xclip"
      - "fontconfig"
      - "unzip"
    scripts:
      - "eza"
      - "pnpm"
      - "plemoljp"
  windows_client:
    winget:
      - "Git.Git"
      - "twpayne.chezmoi"
      - "GitHub.cli"
      - "junegunn.fzf"
      - "BurntSushi.ripgrep.MSVC"
      - "x-motemen.ghq"
      - "eza-community.eza"
      - "Hashicorp.Terraform"
      - "vim.vim"
      - "jdx.mise"
      - "wez.wezterm"
      - "DigitalScholar.Zotero"
      # VS Code's Windows 11 context menu DLL is 32-bit and needs the x86 runtime
      - "Microsoft.VCRedist.2015+.x86"
      # MERGETASKS adds "Open with Code" to the Windows 11 Explorer context menu
      - id: "Microsoft.VisualStudioCode"
        override: "/VERYSILENT /NORESTART /MERGETASKS=!runcode,addcontextmenufiles,addcontextmenufolders"
      - "DeepL.DeepL"
      - "WiresharkFoundation.Wireshark"
      - "Google.Chrome.EXE"
      - "SlackTechnologies.Slack"
      - "Discord.Discord"
      - "Nextcloud.NextcloudDesktop"
      - "Zoom.Zoom"
      - "VideoLAN.VLC"
      - "OBSProject.OBSStudio"
      - "Obsidian.Obsidian"
      - "Bitwarden.Bitwarden"
    scripts:
      - "plemoljp"
